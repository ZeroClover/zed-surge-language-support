# Synthetic profile for editor testing; not your active Surge configuration.
[General]
loglevel = notify
dns-server = system, 1.1.1.1
ipv6 = true

[Proxy]
本地代理 = socks5, 127.0.0.1, 1080
HTTPS Proxy = https, proxy.example.com, 443, username="demo", password="a,#; //b"

[Proxy Group]
自动选择 = select, DIRECT, 本地代理, HTTPS Proxy

[Rule]
DOMAIN-SUFFIX,example.com,自动选择
URL-REGEX,"^https://example.com/a,b",DIRECT
AND,((DOMAIN,example.com),(DEST-PORT,443)),自动选择
IP-CIDR,10.0.0.0/8,DIRECT,no-resolve # internal network
FINAL,DIRECT

[Script]
demo = type=http-request, pattern=^https://example.com/, script-path=https://example.com/test.js#v1

[URL Rewrite]
^https://old.example.com/(.*) https://new.example.com/$1 302

[MITM]
hostname = %APPEND% *.example.com
