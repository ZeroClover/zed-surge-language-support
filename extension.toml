id = "surge"
name = "Surge"
version = "0.1.0"
schema_version = 1
authors = ["Surge Zed contributors"]
description = "Surge configurations, modules, and rule sets, with native Surge CLI diagnostics."
# Zed's Node.js runs server/surge-lsp.mjs to check the configured surge-cli.
capabilities = [{ kind = "process:exec", command = "*", args = ["*", "check", "*"] }]

[language_servers.surge]
name = "Surge Language Server"
languages = ["Surge Configuration", "Surge Module", "Surge Rule Set"]

[language_servers.surge.language_ids]
"Surge Configuration" = "surge"
"Surge Module" = "surge-module"
"Surge Rule Set" = "surge-ruleset"

# scripts/prepare.mjs writes a local file:// repository and exact commit here.
[grammars.surge]
repository = "file:///Volumes/Git/zed-surge-language-support/.build/grammar-repository"
rev = "41ac80149150f1639212ac488d758acef017caf9"
